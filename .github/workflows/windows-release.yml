name: Windows EXE Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.13,<7"
      - name: Run tests
        run: python -m unittest discover -p "test_*.py" -v
      - name: Build EXE
        run: python tools/build_exe.py
      - name: Verify Windows EXE
        shell: pwsh
        run: |
          $exe = Join-Path $pwd "dist\MultiEngineAssetBrowser.exe"
          if (-not (Test-Path $exe)) { throw "EXE not found" }
          $log = Join-Path $env:RUNNER_TEMP "meab-self-test.txt"
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test", $log) -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "EXE self-test failed: $($p.ExitCode)" }
          if (-not (Test-Path $log)) { throw "EXE did not create smoke-test log" }
          if (-not (Select-String -Path $log -Pattern "^OK$" -Quiet)) { throw "EXE self-test did not report OK" }
      - name: Write SHA-256 checksum
        run: python tools/hash_exe.py dist/MultiEngineAssetBrowser.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MultiEngineAssetBrowser-Windows-x64
          path: |
            dist/MultiEngineAssetBrowser.exe
            dist/MultiEngineAssetBrowser.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Multi-Engine Asset Browser ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/MultiEngineAssetBrowser.exe
            dist/MultiEngineAssetBrowser.exe.sha256
