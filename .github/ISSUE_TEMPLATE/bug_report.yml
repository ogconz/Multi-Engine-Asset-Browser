name: Bug report
description: Report a crash, failed scan or export issue
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include AES keys, game archives or copyrighted assets."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v2.2.0
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Game engine
      options:
        - Unity
        - Unreal Engine 4
        - Other / Unsure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Mention your game, Windows version, error text and any relevant engine override. Redact private paths and keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
